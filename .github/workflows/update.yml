name: עדכון מחירים ופרסום האתר

on:
  schedule:
    - cron: "15 3 * * *"   # כל בוקר (05:15 / 06:15 שעון ישראל)
  workflow_dispatch:        # כפתור "Run workflow" לעדכון ידני
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: התקנת ספריות
        run: pip install -r app/requirements.txt

      - name: הורדת מחירים מכל הרשתות וייצוא
        env:
          PREVIOUS_DATA_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/prices.json
        run: python tools/build_data.py

      - name: שמירת מיקומי סניפים שאותרו
        run: |
          if [ -n "$(git status --porcelain geo.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add geo.json
            git commit -m "עדכון מיקומי סניפים [skip ci]"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
